<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUSTAM Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .calculator {
      width: 340px;
      padding: 20px;
      border-radius: 25px;
      background: #111827;
      box-shadow: 0 15px 40px rgba(0,0,0,0.45);
    }

    .title {
      text-align: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .display {
      width: 100%;
      height: 90px;
      border: none;
      outline: none;
      border-radius: 18px;
      background: #1f2937;
      color: white;
      font-size: 38px;
      text-align: right;
      padding: 15px;
      margin-bottom: 15px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 18px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      background: #374151;
      color: white;
    }

    button:active {
      transform: scale(0.94);
    }

    .operator {
      background: #2563eb;
    }

    .clear {
      background: #dc2626;
    }

    .equal {
      background: #16a34a;
    }

    .zero {
      grid-column: span 2;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      margin-top: 15px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="title">🧮 RUSTAM Calculator</div>

    <input
      type="text"
      id="display"
      class="display"
      value="0"
      readonly
    >

    <div class="buttons">

      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="percent()">%</button>
      <button class="operator" onclick="addOperator('/')">÷</button>

      <button onclick="addNumber('7')">7</button>
      <button onclick="addNumber('8')">8</button>
      <button onclick="addNumber('9')">9</button>
      <button class="operator" onclick="addOperator('*')">×</button>

      <button onclick="addNumber('4')">4</button>
      <button onclick="addNumber('5')">5</button>
      <button onclick="addNumber('6')">6</button>
      <button class="operator" onclick="addOperator('-')">−</button>

      <button onclick="addNumber('1')">1</button>
      <button onclick="addNumber('2')">2</button>
      <button onclick="addNumber('3')">3</button>
      <button class="operator" onclick="addOperator('+')">+</button>

      <button class="zero" onclick="addNumber('0')">0</button>
      <button onclick="addNumber('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="footer">
      RUSTAM • Calculator 1.0
    </div>

  </div>

  <script>
    let display = document.getElementById("display");
    let current = "0";

    function updateDisplay() {
      display.value = current;
    }

    function addNumber(number) {
      if (current === "0" && number !== ".") {
        current = number;
      } else {
        current += number;
      }

      updateDisplay();
    }

    function addOperator(operator) {
      let last = current.slice(-1);

      if (["+", "-", "*", "/"].includes(last)) {
        current = current.slice(0, -1) + operator;
      } else {
        current += operator;
      }

      updateDisplay();
    }

    function clearDisplay() {
      current = "0";
      updateDisplay();
    }

    function deleteLast() {
      if (current.length > 1) {
        current = current.slice(0, -1);
      } else {
        current = "0";
      }

      updateDisplay();
    }

    function percent() {
      try {
        current = String(parseFloat(current) / 100);
        updateDisplay();
      } catch {
        current = "Error";
        updateDisplay();
      }
    }

    function calculate() {
      try {
        let result = Function(
          '"use strict"; return (' + current + ')'
        )();

        if (!isFinite(result)) {
          current = "Error";
        } else {
          current = String(result);
        }

        updateDisplay();

      } catch {
        current = "Error";
        updateDisplay();

        setTimeout(() => {
          current = "0";
          updateDisplay();
        }, 1000);
      }
    }
  </script>

</body>
</html>
