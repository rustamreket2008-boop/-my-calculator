<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Calc</title><style>body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif}.calc{background:#1c1c1e;padding:20px;border-radius:30px;width:310px}#ekran{width:100%;height:70px;background:#000;color:#fff;font-size:42px;text-align:right;border:none}button{width:65px;height:65px;margin:5px;border-radius:50%;border:none;font-size:26px}.n{background:#333;color:#fff}.o{background:#ff9f0a;color:#fff}.f{background:#a5a5a5}.z{width:140px;border-radius:32px;text-align:left;padding-left:25px}</style></head><body><div class="calc"><input id="ekran" value="0" disabled><div><button class="f" onclick="ekran.value='0'">C</button><button class="f" onclick="ekran.value=ekran.value.slice(0,-1)">⌫</button><button class="f" onclick="add('%')">%</button><button class="o" onclick="add('/')">÷</button></div><div><button class="n" onclick="add('7')">7</button><button class="n" onclick="add('8')">8</button><button class="n" onclick="add('9')">9</button><button class="o" onclick="add('*')">×</button></div><div><button class="n" onclick="add('4')">4</button><button class="n" onclick="add('5')">5</button><button class="n" onclick="add('6')">6</button><button class="o" onclick="add('-')">-</button></div><div><button class="n" onclick="add('1')">1</button><button class="n" onclick="add('2')">2</button><button class="n" onclick="add('3')">3</button><button class="o" onclick="add('+')">+</button></div><div><button class="n z" onclick="add('0')">0</button><button class="n" onclick="add('.')">.</button><button class="o" onclick="go()">=</button></div></div><script>function add(v){if(ekran.value=='0')ekran.value='';ekran.value+=v}function go(){try{ekran.value=eval(ekran.value)}catch{ekran.value='Error'}}</script></body></html>
